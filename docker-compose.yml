version: '3.8'

services:
  sphincs-stateless-hash-sign:
    build: .
    container_name: sphincs-stateless-hash-sign
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=sphincs-stateless-hash-sign-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
