[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sphincs-stateless-hash-sign"
version = "2.0.0"
description = "SLH-DSA / SPHINCS+ Stateless Hash-Based Post-Quantum Signature Supervisor"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
sphincs-stateless-hash-sign = "sphincs_hash_sign.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/sphincs-stateless-hash-sign"
Repository = "https://github.com/abusuraihsakhri/sphincs-stateless-hash-sign.git"
